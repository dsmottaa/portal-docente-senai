<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Avisos | SENAI - Portal do Docente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body class="dashboard-body" data-active="mural.html">
  <div class="feature-layout">
    <aside class="sidebar sidebar-features">
      <div class="sidebar-brand">
        <img src="../img/senailogo.png" alt="SENAI" class="sidebar-logo-img">
        <div class="brand-text">
          <span class="brand-name">SENAI</span>
          <span class="brand-sub">PORTAL DO DOCENTE</span>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-profile-card">
          <div class="avatar-ln" id="avatarLN">LN</div>
          <div class="sidebar-profile-info">
            <div class="profile-name" id="sidebarName">Prof. Lucas Nogueira</div>
            <div class="profile-role" id="sidebarRole">DOC-84091 &middot; SENAI</div>
          </div>
        </div>
        <div id="syncStatus" class="sidebar-sync"></div>
        <a href="index.html" class="btn-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="feature-main">
      <div class="feature-header">
        <div class="feature-title-group">
          <div class="feature-icon-box blue">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H5l-3 3V4z"></path><line x1="8" y1="9" x2="16" y2="9"></line><line x1="8" y1="13" x2="13" y2="13"></line></svg>
          </div>
          <div>
            <h1 class="feature-page-title">Mural de Avisos</h1>
            <span class="feature-page-sub">Comunicados institucionais das unidades SENAI e da coordenação nacional</span>
          </div>
        </div>
        <button type="button" class="btn-red-primary btn-sm-inline" id="btnNovoComunicado">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Novo aviso
        </button>
      </div>

      <div id="muralList" class="mural-list"></div>
    </main>
  </div>

  <!-- Modal: novo comunicado -->
  <div id="modalNovoComunicado" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <button type="button" class="modal-close" data-close-modal>&times;</button>
      <h2 class="modal-title">Novo comunicado</h2>
      <p class="modal-subtitle">Os avisos nacionais são compartilhados com todas as unidades do portal e sincronizados no servidor.</p>
      <div class="mat-field">
        <label for="comuTitulo">Título</label>
        <input type="text" id="comuTitulo" class="modal-input-light" placeholder="Ex.: Reunião pedagógica de fechamento de bimestre" autocomplete="off">
      </div>
      <div class="mat-field">
        <label for="comuConteudo">Mensagem</label>
        <textarea id="comuConteudo" class="modal-textarea-light" rows="5" placeholder="Descreva o aviso, data, horários, prazos e público-alvo..."></textarea>
      </div>
      <div class="mat-field">
        <label for="comuVisibilidade">Visibilidade</label>
        <select id="comuVisibilidade" class="modal-input-light">
          <option value="todas_unidades">Nacional (todas as unidades)</option>
          <option value="turma">Somente a minha unidade</option>
        </select>
      </div>
      <div class="modal-actions-row">
        <button type="button" class="btn-subtle" data-close-modal>Cancelar</button>
        <button type="button" id="btnSalvarComunicado" class="btn-red-primary">Publicar aviso</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="../js/sidebar.js"></script>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/mural.js"></script>
</body>
</html>
