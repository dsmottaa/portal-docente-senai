<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrências | SENAI - Portal do Docente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body class="dashboard-body" data-active="ocorrencias.html">
  <div class="feature-layout">
    <aside class="sidebar sidebar-features">
      <div class="sidebar-brand">
        <img src="../img/senailogo.png" alt="SENAI" class="sidebar-logo-img">
        <div class="brand-text">
          <span class="brand-name">SENAI</span>
          <span class="brand-sub">PORTAL DO DOCENTE</span>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-profile-card">
          <div class="avatar-ln" id="avatarLN">LN</div>
          <div class="sidebar-profile-info">
            <div class="profile-name" id="sidebarName">Prof. Lucas Nogueira</div>
            <div class="profile-role" id="sidebarRole">DOC-84091 &middot; SENAI</div>
          </div>
        </div>
        <div id="syncStatus" class="sidebar-sync"></div>
        <a href="index.html" class="btn-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="feature-main">
      <div class="feature-header">
        <div class="feature-title-group">
          <div class="feature-icon-box red">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          </div>
          <div>
            <h1 class="feature-page-title">Ocorrências</h1>
            <span class="feature-page-sub">Registro e acompanhamento de ocorrências da turma</span>
          </div>
        </div>
        <button type="button" class="btn-primary" id="btnNovaOcorrencia">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nova Ocorrência
        </button>
      </div>

      <div id="statsRow" class="stats-row"></div>

      <div id="ocorrenciaFormWrap" class="feature-card" style="display:none">
        <h3>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Registrar Ocorrência
        </h3>
        <form id="formOcorrencia" class="feature-form">
          <div class="form-row">
            <div class="form-group">
              <label for="selectAluno">Aluno</label>
              <select id="selectAluno" required></select>
            </div>
            <div class="form-group">
              <label for="selectTipo">Tipo de Ocorrência</label>
              <select id="selectTipo" required>
                <option value="">Selecione...</option>
                <option value="EPI inadequado">EPI Inadequado / Ausente</option>
                <option value="Descumprimento de norma">Descumprimento de Norma de Segurança</option>
                <option value="Comportamento inadequado">Comportamento Inadequado</option>
                <option value="Acidente sem afastamento">Acidente (sem afastamento)</option>
                <option value="Acidente com afastamento">Acidente (com afastamento)</option>
                <option value="Avaria em equipamento">Avaria em Equipamento</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="selectSeveridade">Severidade</label>
              <select id="selectSeveridade" required>
                <option value="">Selecione...</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
              </select>
            </div>
            <div class="form-group" style="display:flex;flex-direction:row;align-items:flex-end;gap:8px;justify-content:flex-end">
              <button type="button" class="btn-secondary" id="btnCancelarOcorrencia">Cancelar</button>
              <button type="submit" class="btn-primary">Registrar</button>
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label for="inputDescricao">Descrição</label>
              <textarea id="inputDescricao" rows="3" required placeholder="Descreva a ocorrência detalhadamente..."></textarea>
            </div>
          </div>
        </form>
      </div>

      <div class="ocorrencia-filter-bar" id="ocorrenciaFilters">
        <button type="button" class="ocorrencia-filter-btn active" data-filter="all">Todas</button>
        <button type="button" class="ocorrencia-filter-btn" data-filter="aberta">Abertas</button>
        <button type="button" class="ocorrencia-filter-btn" data-filter="resolvida">Resolvidas</button>
      </div>

      <div id="ocorrenciaList"></div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="../js/sidebar.js"></script>
  <script src="../js/theme.js"></script>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ocorrencias.js"></script>
</body>
</html>
