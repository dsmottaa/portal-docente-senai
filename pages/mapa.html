<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva da Sala | SENAI - Portal do Docente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body class="dashboard-body" data-active="mapa.html">
  <div class="feature-layout">
    <aside class="sidebar sidebar-features">
      <div class="sidebar-brand">
        <img src="../img/senailogo.png" alt="SENAI" class="sidebar-logo-img">
        <div class="brand-text">
          <span class="brand-name">SENAI</span>
          <span class="brand-sub">PORTAL DO DOCENTE</span>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-profile-card">
          <div class="avatar-ln" id="avatarLN">LN</div>
          <div class="sidebar-profile-info">
            <div class="profile-name" id="sidebarName">Prof. Lucas Nogueira</div>
            <div class="profile-role" id="sidebarRole">DOC-84091 &middot; SENAI</div>
          </div>
        </div>
        <div id="syncStatus" class="sidebar-sync"></div>
        <a href="index.html" class="btn-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="feature-main">
      <div class="feature-header">
        <div class="feature-title-group">
          <div class="feature-icon-box amber">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16.01"></line><line x1="16" y1="16" x2="16" y2="16.01"></line></svg>
          </div>
          <div>
            <h1 class="feature-page-title">Reserva da Sala</h1>
            <span class="feature-page-sub">Agenda de reservas da sala/oficina</span>
          </div>
        </div>
        <div class="feature-header-actions">
          <button type="button" id="btnNovaReserva" class="btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nova Reserva
          </button>
        </div>
      </div>

      <div class="reserva-panel">
        <div class="reserva-toolbar">
          <div class="reserva-date-control">
            <label for="reservaData">Data do dia</label>
            <input type="date" id="reservaData" class="reserva-date-input">
          </div>
          <span class="reserva-day-info" id="reservaDayInfo"></span>
        </div>
        <div id="agendaList" class="reserva-list"></div>
      </div>
    </main>
  </div>

  <!-- Modal Reserva -->
  <div class="modal-overlay hidden" id="reservaModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="reservaModalTitle">Nova Reserva</h3>
        <button type="button" class="modal-close" id="btnCloseReservaModal" aria-label="Fechar">&times;</button>
      </div>
      <form id="reservaForm" class="modal-form">
        <input type="hidden" id="rvId">
        <div class="form-group">
          <label for="rvOficina">Oficina / Sala</label>
          <input type="text" id="rvOficina" placeholder="Ex.: Oficina 2 (Bancada A)">
        </div>
        <div class="reserva-form-grid">
          <div class="form-group">
            <label for="rvData">Data</label>
            <input type="date" id="rvData" required>
          </div>
          <div class="form-group">
            <label for="rvInicio">Início</label>
            <input type="time" id="rvInicio" required>
          </div>
          <div class="form-group">
            <label for="rvFim">Fim</label>
            <input type="time" id="rvFim" required>
          </div>
        </div>
        <div class="reserva-form-grid">
          <div class="form-group">
            <label for="rvTurma">Turma</label>
            <input type="text" id="rvTurma" placeholder="Ex.: TEC-MEC-21" required>
          </div>
          <div class="form-group">
            <label for="rvDisciplina">Disciplina</label>
            <input type="text" id="rvDisciplina" placeholder="Ex.: Automação Industrial" required>
          </div>
        </div>
        <div class="form-group">
          <label for="rvObservacoes">Observações</label>
          <textarea id="rvObservacoes" rows="2" placeholder="Opcional"></textarea>
        </div>
        <div id="reservaConflict" class="reserva-conflict hidden"></div>
      </form>
      <div class="modal-footer">
        <button type="button" id="btnDeleteReserva" class="btn-delete" hidden>Excluir</button>
        <span class="modal-spacer"></span>
        <button type="button" id="btnCancelReserva" class="btn-secondary">Cancelar</button>
        <button type="button" id="btnSaveReserva" class="btn-primary">Salvar Reserva</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="../js/sidebar.js"></script>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/mapa.js"></script>
</body>
</html>
