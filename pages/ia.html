<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente IA | SENAI - Portal do Docente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body class="dashboard-body" data-active="ia.html">
  <div class="feature-layout">
    <aside class="sidebar sidebar-features">
      <div class="sidebar-brand">
        <img src="../img/senailogo.png" alt="SENAI" class="sidebar-logo-img">
        <div class="brand-text">
          <span class="brand-name">SENAI</span>
          <span class="brand-sub">PORTAL DO DOCENTE</span>
        </div>
      </div>
      <nav class="sidebar-menu" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-profile-card">
          <div class="avatar-ln" id="avatarLN">LN</div>
          <div class="sidebar-profile-info">
            <div class="profile-name" id="sidebarName">Prof. Lucas Nogueira</div>
            <div class="profile-role" id="sidebarRole">DOC-84091 &middot; SENAI</div>
          </div>
        </div>
        <div id="syncStatus" class="sidebar-sync"></div>
        <a href="index.html" class="btn-logout">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <main class="feature-main">
      <div class="feature-header">
        <div class="feature-title-group">
          <div class="feature-icon-box blue">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16.01"></line><line x1="16" y1="16" x2="16" y2="16.01"></line></svg>
          </div>
          <div>
            <h1 class="feature-page-title">Assistente IA</h1>
            <span class="feature-page-sub">Consulte dados da turma em linguagem natural</span>
          </div>
        </div>
        <div class="feature-header-actions">
          <span id="iaSubWrap" class="ia-sub-wrap" style="display:none">
            <span class="ia-sub-label">Contexto:</span>
            <select id="iaSubFilter" class="model-select" title="Analisar a turma inteira ou apenas uma sub turma">
              <option value="">Turma toda</option>
            </select>
          </span>
          <select id="modelSelect" class="model-select" title="Modelo usado pela IA local (via Ollama)"></select>
          <button type="button" class="btn-outline" id="btnLimparChat">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            <span>Limpar conversa</span>
          </button>
          <button type="button" class="btn-red-primary pull-model-btn" id="btnPullModel" title="Baixa o modelo qwen2.5:3b via Ollama (uma única vez)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Baixar modelo IA</span>
          </button>
        </div>
      </div>

      <div class="chat-wrapper">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-suggestions" id="chatSuggestions">
          <button type="button" class="chat-chip" data-q="Resumo geral da turma">Resumo geral</button>
          <button type="button" class="chat-chip" data-q="Quais alunos estão em risco?">Alunos em risco</button>
          <button type="button" class="chat-chip" data-q="Monte um plano de ação da turma">Plano de ação</button>
          <button type="button" class="chat-chip" data-q="Quais alunos estão ausentes hoje?">Ausentes hoje</button>
          <button type="button" class="chat-chip" data-q="Qual a média da turma?">Média da turma</button>
          <button type="button" class="chat-chip" data-q="Liste os alunos com nota abaixo de 70">Notas abaixo de 70</button>
          <button type="button" class="chat-chip" data-q="Alunos com frequência abaixo de 80%">Frequência &lt; 80%</button>
          <button type="button" class="chat-chip" data-q="Alunos com observações registradas">Observações</button>
          <button type="button" class="chat-chip" data-q="Quais as ocorrências recentes da turma?">Ocorrências</button>
          <button type="button" class="chat-chip" data-q="Próximas reservas da sala">Reservas</button>
          <button type="button" class="chat-chip" data-q="Destaques da turma hoje">Destaques</button>
        </div>
        <div class="chat-input-wrap">
          <input type="text" id="chatInput" placeholder="Digite sua pergunta sobre a turma..." autocomplete="off">
          <button type="button" id="btnChatSend">Enviar</button>
        </div>
      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="../js/sidebar.js"></script>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ia.js"></script>
</body>
</html>
